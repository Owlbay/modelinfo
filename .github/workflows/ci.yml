name: ci

# 检查与构建：推送与 PR 都会运行。发布由 Cloudflare Workers Builds 在 main 更新后自动完成。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 数据校验 / Validate data
        run: node scripts/validate-data.mjs
      - run: pnpm check
      - run: pnpm build
