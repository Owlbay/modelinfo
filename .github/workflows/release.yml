name: release

# 发布：推送 v* 标签后检查、构建，再把标签所在提交推到 release 分支；
# Cloudflare Workers Builds 的生产分支为 release，由它构建并发布。GitHub 不保存 Cloudflare 凭据。
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 标签必须在 main 上 / Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 数据校验 / Validate data
        run: node scripts/validate-data.mjs
      - run: pnpm check
      - run: pnpm build
      - name: 更新 release 分支 / Update release branch
        run: git push --force origin "$GITHUB_SHA:refs/heads/release"
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
