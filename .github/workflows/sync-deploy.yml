name: Sync & Deploy

on:
  schedule:
    - cron: "17 */6 * * *" # 每 6 小时采集一次上游数据
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sync-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - id: sync
        name: Sync catalog data
        run: pnpm sync
        env:
          # 仓库 Variables 中配置线上地址后，会与线上数据比较：记录数骤降则失败、无变化则跳过定时部署
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

  deploy-cf:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || needs.build.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # 以后自托管时在此新增 deploy-server，复用同一份 site artifact（rsync 或构建镜像推送 GHCR）。
